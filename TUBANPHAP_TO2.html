<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102C46">
<title>Tư Bản Pháp – Chuyến Tàu Ánh Dương | UI Redesign</title>
<style>
:root{--navy:#173B57;--teal:#167C80;--sun:#F4B942;--coral:#E56B5D;--cream:#FFF8EA;--sky:#DFF2FF;--ink:#16364e;--muted:#5c7487;--line:#dbe8ef;--panel:#ffffff;--good:#1a9d6a;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:20px}
body{margin:0;min-height:100vh;font-family:Arial,"Segoe UI",Tahoma,sans-serif;color:var(--navy);background:linear-gradient(160deg,var(--sky),var(--cream) 70%);background-color:var(--cream)}
button,input{font:inherit}
button{cursor:pointer;border:2px solid var(--teal);background:#fff;color:var(--navy);padding:11px 16px;border-radius:14px;font-weight:800;transition:transform .12s,background .18s,color .18s,box-shadow .18s}
button:hover:not(:disabled){background:var(--teal);color:#fff;box-shadow:0 5px 16px rgba(22,124,128,.18)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--teal);color:#fff;font-size:18px;padding:13px 24px}
button.warn{border-color:var(--coral)}
button.ghost{background:transparent}
#app{max-width:1220px;margin:0 auto;padding:14px}
.hidden{display:none!important}
.card{background:rgba(255,255,255,.96);border:1px solid #dfe9f0;border-radius:24px;box-shadow:0 10px 28px rgba(23,59,87,.10);padding:24px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.25em 0;line-height:1.25}
h1{font-size:clamp(30px,4vw,48px)}
h2{font-size:clamp(22px,2.6vw,30px)}
h3{font-size:20px}
p{line-height:1.55}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
#top{display:none;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:18px;padding:11px 14px}
body.g #top,body.g #route,body.g #status{display:flex}body.g #layout{display:flex}
.top-main{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top-pill{font-weight:800}
.mute-btn{padding:9px 13px;font-size:14px;min-width:108px}
#route{display:none;position:relative;margin:15px 8px 24px;height:78px;align-items:flex-start}
.route-line{position:absolute;left:1%;right:1%;top:40px;height:8px;border-radius:999px;background:#cfe0ea}
.route-fill{position:absolute;left:1%;top:40px;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--sun),#eab25a);transition:width .65s}
.stop{position:absolute;top:30px;width:24px;height:24px;border-radius:50%;transform:translateX(-50%);background:#fff;border:3px solid #c9dbe5;display:grid;place-items:center;font-size:10px;font-weight:900}
.stop.on{border-color:var(--teal);background:var(--sun)}
.stop span{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;font-weight:700}.stop.first span{left:0;transform:none;text-align:left}.stop.last span{left:auto;right:0;transform:none;text-align:right}
.train{position:absolute;top:5px;width:48px;height:30px;transform:translateX(-50%);transition:left .65s}
.train .body{fill:var(--navy)}.train .cab{fill:var(--teal)}.train .wheel{fill:var(--sun)}
#layout{display:block;gap:18px;align-items:start}
#main{flex:1;min-width:0}
#board{width:315px;display:none;flex-direction:column;gap:10px;position:sticky;top:18px;align-self:flex-start}
body.g #board{display:flex}
body:not(.g) #board{display:none}
.scoreboard-head{background:linear-gradient(135deg,#173b57,#205f72);color:#fff;border-radius:20px;padding:15px 16px;box-shadow:0 10px 24px rgba(23,59,87,.18);border:1px solid rgba(255,255,255,.18)}
.scoreboard-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;letter-spacing:.5px}
.scoreboard-live{font-size:10px;padding:4px 7px;border-radius:999px;background:#dff6e9;color:#176343;letter-spacing:.8px}
.scoreboard-sub{font-size:11px;opacity:.78;margin-top:5px}.scoreboard-head:before{content:"BẢNG ĐIỂM TRỰC TIẾP";display:block;font-size:9px;letter-spacing:1.5px;opacity:.65;margin-bottom:4px}
.team-card{position:relative;background:#fff;border-radius:18px;border:2px solid var(--line);border-left:10px solid var(--c);padding:13px 15px;box-shadow:0 4px 12px rgba(23,59,87,.07);transition:transform .2s,box-shadow .2s,border-color .2s}
.team-card.active{transform:translateX(-3px);}
.score-line{display:flex;align-items:flex-end;gap:8px;margin:7px 0 5px}
.score-label{font-size:10px;color:#718493;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.score-rankline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.score-progress{height:5px;background:#edf2f4;border-radius:999px;overflow:hidden;margin:7px 0 8px}
.score-progress>i{display:block;height:100%;width:0;border-radius:999px;background:var(--c);transition:width .45s ease}
.team-card.active{box-shadow:0 0 0 3px var(--c),0 7px 18px rgba(23,59,87,.10)}
.rank-badge{position:absolute;right:12px;top:10px;font-size:12px;font-weight:900;background:#eef5f8;border-radius:999px;padding:5px 8px}
.team-name{font-weight:900;font-size:15px}
.score{font-size:35px;font-weight:900;line-height:1;margin:8px 0;position:relative}
.score-float{position:absolute;left:78px;top:0;font-size:20px;color:var(--teal);animation:floatUp 1.15s forwards;white-space:nowrap}
.score-float.bad{color:var(--coral)}
.team-meta{font-size:12px;color:#516b7d;line-height:1.55}
.tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.5px;padding:3px 7px;border-radius:8px;background:#eff6f8;margin-right:4px}
.status-chip{display:inline-block;margin-top:5px;margin-right:4px;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#fff3d6;color:#705500}
.status-chip.bad{background:#ffe5e0;color:#8b3126}
.status-chip.good{background:#e0f5ea;color:#175f44}
@keyframes floatUp{to{transform:translateY(-17px);opacity:0}}
.question-card{position:relative;overflow:hidden}
.question-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:8px;color:#fff;border-radius:12px;padding:7px 12px;font-weight:900}
.stage-kicker{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--teal)}
.question{font-size:clamp(22px,2.2vw,30px);line-height:1.35;margin:15px 0 18px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{min-height:86px;text-align:left;display:flex;align-items:flex-start;gap:12px;font-size:20px;line-height:1.35;padding:15px}
.option .letter{flex:0 0 34px;display:grid;place-items:center;background:var(--navy);color:#fff;border-radius:10px;padding:4px;font-weight:900}
.option.locked{text-decoration:line-through;background:#f4f5f5;color:#81909a;border-color:#c7d2d7}
.option.correct{background:#dff4e9;border-color:var(--good)}
.option.wrong{background:#ffe6e0;border-color:var(--coral);animation:shake .38s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{background:#fff4d8;border-left:5px solid var(--sun);border-radius:12px;padding:10px 12px;margin:10px 0}
.result{margin-top:15px;padding:14px;border-radius:16px;font-size:18px;font-weight:900}
.result.good{background:#e1f6eb;color:#185f47}.result.bad{background:#ffe5e0;color:#81352b}
.event-grid{display:grid;grid-template-columns:1fr;gap:8px}
.hand{margin-top:18px}
.hand-card{border:1px dashed var(--teal);border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fcffff}
.hand-card .evt-name{font-weight:900}
.hand-card .evt-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.hand-card .evt-hint{font-size:11px;color:var(--coral);font-weight:800}
.section-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.stage-wrap{position:relative;min-height:310px;display:grid;place-items:center;overflow:hidden}
.stage-art{position:absolute;inset:auto 0 0 0;height:180px;pointer-events:none;opacity:.95}
.stage-art .sun{position:absolute;right:9%;top:15px;width:76px;height:76px;border-radius:50%;background:#ffe09a;box-shadow:0 0 50px rgba(244,185,66,.45)}
.art-ground{position:absolute;left:-5%;right:-5%;bottom:-25px;height:120px;background:#dbeff3;border-radius:50% 50% 0 0/30% 30% 0 0}
.stage-art .scene{position:absolute;left:7%;right:7%;bottom:25px;height:90px}
.scene span{position:absolute;display:block}
.stage-1 .scene .field{left:0;right:0;bottom:0;height:45px;background:#bfe2b5;border-radius:45% 45% 0 0}
.stage-1 .scene .market{left:22%;bottom:25px;width:90px;height:38px;background:#f2c27d;border-radius:8px 8px 2px 2px}
.stage-1 .scene .market:before{content:"";position:absolute;left:-8px;right:-8px;top:-16px;height:18px;background:#e56b5d;clip-path:polygon(0 100%,50% 0,100% 100%)}
.stage-2 .scene .factory{left:18%;bottom:20px;width:145px;height:54px;background:#d9dfe4;border-radius:8px}
.stage-2 .scene .chimney{left:54%;bottom:72px;width:18px;height:50px;background:#b7c1c8}
.stage-2 .scene .track{left:0;right:0;bottom:6px;height:10px;border-top:3px solid #8a9aa4;border-bottom:3px solid #8a9aa4;background:repeating-linear-gradient(90deg,transparent 0 18px,#8a9aa4 18px 22px)}
.stage-3 .scene .bank{left:28%;bottom:22px;width:150px;height:55px;background:#f7f3ea;border:4px solid #d7c6a4;border-radius:7px}
.stage-3 .scene .bank:before{content:"₤";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#b9903e;font-weight:900}
.stage-3 .scene .net{left:0;right:0;bottom:10px;height:80px;background:radial-gradient(circle at 20% 50%,#167c80 0 4px,transparent 5px),radial-gradient(circle at 50% 20%,#3b82f6 0 4px,transparent 5px),radial-gradient(circle at 78% 60%,#e56b5d 0 4px,transparent 5px);opacity:.55}
.stage-4 .scene .map{left:20%;bottom:12px;width:190px;height:80px;background:#e8e1c8;border:3px solid #cdbf9d;border-radius:40% 55% 45% 35%;transform:rotate(-6deg)}
.stage-4 .scene .city{right:12%;bottom:18px;width:85px;height:70px;background:repeating-linear-gradient(90deg,#c2ced4 0 16px,#e8eff2 16px 20px);clip-path:polygon(0 100%,0 42%,12% 42%,12% 18%,27% 18%,27% 52%,43% 52%,43% 8%,58% 8%,58% 33%,73% 33%,73% 0,88% 0,88% 100%)}
.modal-backdrop{position:fixed;inset:0;background:rgba(23,59,87,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-backdrop.on{display:flex}
.modal{background:var(--cream);border-radius:24px;padding:20px;max-width:600px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.20)}
.modal-actions{display:grid;gap:8px;margin-top:13px}
.event-card{border:4px solid var(--teal);border-radius:20px;background:#fff;padding:18px;animation:flip .75s}
.event-card.R{border-color:var(--sun)}.event-card.L{border-color:var(--coral);box-shadow:0 0 22px rgba(244,185,66,.45)}
.event-card .rarity{font-size:12px;letter-spacing:1px;font-weight:900}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
#status{display:none;min-height:28px;align-items:center;justify-content:center;text-align:center;margin-top:12px;font-weight:900;color:var(--teal)}
.bottom-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.setup-team{border-top:6px solid var(--c);padding-top:8px}
input[type=text]{width:100%;padding:11px 12px;border:2px solid #cfe3ef;border-radius:12px;background:#fff}
.check{display:block;margin:7px 0;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}th{background:#f3f8fa;position:sticky;top:0}
.final-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.final-stat{background:#f7fafb;border-radius:16px;padding:12px;text-align:center}
.final-stat b{display:block;font-size:24px;margin-top:4px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-14px;width:8px;height:12px;animation:fall 3.1s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hero-route{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}
.hero-stop{background:#f4fafb;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12px;font-weight:800}
.resume-box{margin-top:14px;padding:13px;background:#eef7f8;border-radius:14px}
@media(max-width:920px){#layout{flex-direction:column}#board{width:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.setup-grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.final-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){#app{padding:9px;max-width:100%;overflow-x:hidden}.card{padding:18px}#board{display:flex;overflow-x:auto;flex-direction:row}.team-card{min-width:235px}.option{min-height:72px;font-size:18px}.hero-route{grid-template-columns:1fr 1fr}.final-grid{grid-template-columns:1fr}#route{overflow:hidden;margin-left:0;margin-right:0;padding:0 2px}.stop span{white-space:normal;width:78px;text-align:center;font-size:9px;line-height:1.05}.train{width:42px}.top-main{min-width:0;gap:8px}.top-main span{overflow-wrap:anywhere}.final-grid + div{max-width:100%;overflow-x:auto}.final-grid + div table{min-width:620px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 2026 UI REDESIGN: SUNLIGHT RAILWAY / HISTORICAL BOARD ===== */
:root{
  --navy:#102c46; --navy-2:#193f5c; --teal:#147f82; --teal-2:#1b9a96;
  --sun:#e7a62f; --gold:#c88920; --coral:#d85d50; --cream:#f7f0df;
  --paper:#fffdf7; --paper-2:#f4ead4; --sky:#dcecf0; --ink:#17354d; --muted:#65798a;
  --line:#d7d5c8; --good:#17845f; --shadow:0 18px 45px rgba(16,44,70,.13);
}
html{background:#102c46}
body{
  min-height:100vh;color:var(--ink);
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 4%,rgba(231,166,47,.18),transparent 27%),
    radial-gradient(circle at 92% 18%,rgba(20,127,130,.16),transparent 30%),
    linear-gradient(135deg,#dcecf0 0%,#f7f0df 54%,#efe4cb 100%);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(16,44,70,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,44,70,.035) 1px,transparent 1px);background-size:24px 24px;z-index:-1}
#app{max-width:1320px;padding:18px 18px 32px}
.card{
  background:linear-gradient(180deg,rgba(255,253,247,.98),rgba(255,250,239,.96));

  position:relative;overflow:hidden;
}
.card:after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--teal),var(--sun),var(--coral));opacity:.9}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--navy);letter-spacing:-.02em}

h2{font-size:clamp(24px,3vw,34px)}
button{border:1px solid rgba(16,44,70,.16);background:var(--paper);color:var(--navy);border-radius:14px;padding:11px 16px;font-weight:850;box-shadow:0 3px 0 rgba(16,44,70,.06);transition:.18s ease}
button:hover:not(:disabled){background:var(--navy);color:#fff;transform:translateY(-2px);box-shadow:0 9px 22px rgba(16,44,70,.18)}
button.pri{background:linear-gradient(135deg,var(--teal),#0e666a);border-color:#0e666a;color:#fff;padding:14px 25px;border-radius:16px;box-shadow:0 8px 20px rgba(20,127,130,.25)}
button.warn{border-color:rgba(216,93,80,.5);color:#9d3d33;background:#fff5f2}
button.ghost{border-color:rgba(16,44,70,.18);background:rgba(255,255,255,.5)}
#top{
  background:linear-gradient(100deg,#0d2941,#174664 65%,#126e72);border:1px solid rgba(255,255,255,.13);
  border-radius:20px;padding:12px 15px;box-shadow:0 12px 28px rgba(16,44,70,.18);position:relative;overflow:hidden
}
#top:before{content:"🚂";font-size:30px;opacity:.13;position:absolute;right:150px;top:-4px;transform:rotate(-5deg)}
.top-main{gap:9px}.top-main>span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);padding:7px 10px;border-radius:10px;font-size:13px}
.top-main .top-pill{background:var(--sun);color:#35260d;border:0;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.mute-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
#route{height:96px;margin:14px 12px 25px}
.route-line{top:48px;height:10px;background:#c6d4d7;border:2px solid rgba(16,44,70,.08)}

.stop.on{border-color:var(--teal);background:var(--sun);color:#17354d;box-shadow:0 0 0 5px rgba(231,166,47,.14)}

.train{top:4px;filter:drop-shadow(0 5px 4px rgba(16,44,70,.18))}

function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]]}return b}

function rankedTeams(){

  const top=G.teams.filter(t=>t.score===topScore);
  const fallbackActive=!!G.tieBreakResolvedByCorrect&&G.tieTeams?.length>1;
  const correctMax=fallbackActive?Math.max(...G.tieTeams.map(id=>teamById(id)?.correct||0)):-1;
  return [...G.teams].sort((a,b)=>{
    if(a.score!==b.score)return b.score-a.score;
    if(G.tieBreakWinner!==null){
      if(a.id===G.tieBreakWinner)return -1;
      if(b.id===G.tieBreakWinner)return 1;
    }
    if(fallbackActive && a.score===topScore && b.score===topScore && a.correct!==b.correct)return b.correct-a.correct;
    return b.correct-a.correct;
  });
}

function makePositionBag(){
  const bag=[...Array(6).fill("A"),...Array(6).fill("B"),...Array(6).fill("C"),...Array(6).fill("D")];
  const hasTriple=x=>x.some((v,i)=>i>=2&&x[i-1]===v&&x[i-2]===v);
  for(let attempt=0;attempt<5000;attempt++){const x=shuffle(bag);if(!hasTriple(x))return x}
  return ["A","C","B","D","B","C","D","B","C","A","D","A","C","A","D","B","A","C","B","D","C","B","A","D"];
}
function arrangeQuestion(q,index){
  const target=LETTERS.indexOf(G.positionBag[index]);
  const correct=q.options.find(o=>o.id===q.answerId);
  const wrong=shuffle(q.options.filter(o=>o.id!==q.answerId));
  const out=new Array(4);out[target]=correct;let k=0;for(let i=0;i<4;i++)if(!out[i])out[i]=wrong[k++];return out;
}
function applyAnswerDistortion(arr,kind,q){
  if(kind==="lock"){const wrong=arr.map((o,i)=>o.id===q.answerId?-1:i).filter(i=>i>=0);return {arr,disabledIndex:wrong[(Math.random()*wrong.length)|0]}}
  if(kind==="swap"){const wrong=arr.map((o,i)=>o.id===q.answerId?-1:i).filter(i=>i>=0);const pair=shuffle(wrong).slice(0,2);[arr[pair[0]],arr[pair[1]]]=[arr[pair[1]],arr[pair[0]]];return {arr,disabledIndex:-1}}
  return {arr,disabledIndex:-1};
}
function prepareQuestion(){
  if(!G||G.questionIndex<0||G.questionIndex>=QS.length)return;
  if(G.renderedQuestionIndex===G.questionIndex&&Array.isArray(G.renderedOptions)&&G.renderedOptions.length===4)return;
  const t=currentTeam(),q=QS[G.questionIndex];const d=applyAnswerDistortion(arrangeQuestion(q,G.questionIndex),t.negativePending?.kind,q);
  G.renderedOptions=d.arr;G.disabledIndex=d.disabledIndex;G.renderedQuestionIndex=G.questionIndex;saveState();
}

function nextAnsweringTeam(fromId){
  const visited=new Set([fromId]);
  let candidate=normalNextFrom(fromId);
  for(let i=0;i<3;i++){
    if(visited.has(candidate))break;
    visited.add(candidate);
    const t=teamById(candidate);
    if(!t){candidate=normalNextFrom(candidate);continue}
    if(hasAttemptedTeam(candidate)){candidate=normalNextFrom(candidate);continue}
    if(t.skipPending){
      t.skipPending=false;t.skipStreak=1;t.skipped++;
      G.attemptedTeams.push(candidate);
      G.questionAttempts.push({teamId:candidate,status:"skipped"});
      say(`${t.name} bị Bỏ Lượt và không tham gia câu này.`);
      candidate=normalNextFrom(candidate);
      continue;
    }
    return candidate;
  }
  return null;
}
function resolveSkipCandidate(candidate,fromSource){
  const t=teamById(candidate);
  if(!t)return null;
  if(t.skipPending){t.skipPending=false;t.skipStreak=1;t.skipped++;say(`${t.name} bị Bỏ Lượt. Hệ thống tiếp tục tìm lượt hợp lệ.`);return {skipped:true,fromSource}}
  return {skipped:false,fromSource};
}
function chooseNextTeam(){
  const old=G.currentTeam;let next=null;let source="normal";let followAfterForced=null;
  if(G.extraRequested && G.consecutiveTurns<2){
    G.extraRequested=false;G.consecutiveTurns++;G.questionIndex++;G.currentTeam=old;
    if(G.questionIndex%6===0){stageIntro(G.questionIndex/6|0);return}
    startQuestionForTeam(old);return;
  }
  G.extraRequested=false;
  if(G.forcedNext!==null){next=G.forcedNext;G.forcedNext=null;source="forced";followAfterForced=G.forcedFollowNext;G.forcedFollowNext=null}
  else if(G.turnPlan.length){next=G.turnPlan.shift();source="plan"}
  else if(G.forcedFollowNext!==null){next=G.forcedFollowNext;G.forcedFollowNext=null;source="forced-follow"}
  else{next=normalNextFrom(old);source="normal"}

  const visited=new Set();
  while(visited.size<3){
    if(next===null||visited.has(next))break;visited.add(next);
    const t=teamById(next);
    if(t&&t.skipPending){t.skipPending=false;t.skipStreak=1;t.skipped++;say(`${t.name} bị Bỏ Lượt.`);
      if(source==="plan"&&G.turnPlan.length){next=G.turnPlan.shift();continue}
      if(source==="forced"&&followAfterForced!==null){next=followAfterForced;followAfterForced=null;source="forced-follow";continue}
      next=normalNextFrom(next);continue;
    }
    break;
  }
  if(source==="forced"&&followAfterForced!==null)G.forcedFollowNext=followAfterForced;
  G.consecutiveTurns=(next===old)?Math.min(2,G.consecutiveTurns+1):1;
  consumeOrderLock();
  if(G.questionIndex>=23){G.currentTeam=next;finishCheck();return}
  G.questionIndex++;G.currentTeam=next;
  if(G.questionIndex%6===0){stageIntro(G.questionIndex/6);return}
  startQuestionForTeam(next);
}

  G.attemptedTeams.push(t.id);

    t.correct++;let total=100;if(t.positivePending)total=t.positivePending.total;if(t.negativePending?.kind==="c50")total=50;if(t.negativePending?.kind==="cut")total=Math.min(total,150);

    if(t.negativePending&&["lock","c50","cut","swap","inter"].includes(t.negativePending.kind))t.negativePending=null;

function attackTargetValid(owner,e,target){
  if(!target||target.id===owner.id)return false;

  if([11,24].includes(e.id)&&G.lockOrderTurns>0)return false;

  if(e.id===24){const raw=rawNextTeam();if(target.id!==raw)return false;if(G.lastSkipTarget===target.id)return false}

function validTargets(owner,eid){const e=EVENT_BY_ID.get(eid);return G.teams.filter(t=>attackTargetValid(owner,e,t))}
function nextTargetPreviewForSkip(owner){const raw=rawNextTeam();return teamById(raw)}

function stageWeights(){return [[3,.7,1,1.2,.5],[1.5,1.2,2,1,1],[1,1.3,1.3,1.5,1],[1,1,1,1,1.5]][stageIndex()]}
function rarityWeights(){return [{C:1,R:.25,L:0},{C:1,R:.5,L:.1},{C:1,R:.8,L:.3},{C:1,R:1.2,L:1.2}][stageIndex()]}
function weightedEventPick(list){
  if(!list.length)return null;
  const GW=stageWeights(),RW=rarityWeights(),weight=e=>GW[e.group]*RW[e.rarity];

  if(total<=0)return list[(Math.random()*list.length)|0];
  let r=Math.random()*total;
  for(const e of list){r-=weight(e);if(r<0)return e}
  return list[list.length-1];
}
function drawEvent(owner){
  const remaining=EVENTS.filter(e=>!G.usedEventIds.includes(e.id));

    const commons=remaining.filter(e=>e.rarity==="C"&&eventAvailableForDraw(owner,e));
    const any=remaining.filter(e=>eventAvailableForDraw(owner,e));
    pick=weightedEventPick(sameRarity)||weightedEventPick(commons)||weightedEventPick(any);

function defenseOptions(target,attackId){return [
  ...target.armed.filter(id=>[29,30,32,33,34].includes(id)&&defenseMatches(id,attackId)).map(id=>({id,where:"armed"})),
  ...target.hand.filter(id=>[29,30,32,33,34].includes(id)&&defenseMatches(id,attackId)).map(id=>({id,where:"hand"}))

function defenseMatches(id,attackId){if(id===29)return ATTACK_IDS.has(attackId);if(id===30)return [11,24].includes(attackId);if(id===32)return ATTACK_IDS.has(attackId);if(id===33)return ATTACK_IDS.has(attackId);if(id===34)return [11,24].includes(attackId);return false}

  return false;
}
function attack(owner,id,target,finish,source="direct"){
  const e=EVENT_BY_ID.get(id);G.lastAttack={owner:owner.id,target:target.id};if(id===24)G.lastSkipTarget=target.id;target.attacks++;say(`Event – ${e.name}: ${owner.name} → ${target.name}`);G.pendingAttack={owner:owner.id,target:target.id,event:id,source};setPhase("DEFENSE");return presentDefense(owner,id,target,finish);
}
function resumePendingDefense(){
  const p=G.pendingAttack;if(!p)return false;const owner=teamById(p.owner),target=teamById(p.target);if(!owner||!target){G.pendingAttack=null;G.pendingEventId=null;saveState();return false}
  const finish=()=>{if(p.source==="hand"){removeFromHand(owner,p.event);owner.eventsUsed++;saveState();G.currentTeam=owner.id;renderQuestion()}else if(p.source==="drawn"){G.pendingEventId=null;owner.eventsUsed++;saveState();finalizeTurnAndAdvance()}else{saveState()}};
  return presentDefense(owner,p.event,target,finish);
}

function finalizeTurnAndAdvance(){closeModal();const finished=currentTeam();if(finished.negativePending?.kind==="noatk")finished.negativePending=null;G.pendingEventId=null;G.eventRollOutcome=null;consumeOrderLock();saveState();if(G.questionIndex>=23){finishCheck();return}chooseNextTeam()}
function finishCheck(){
  closeModal();setPhase("FINAL");const mx=Math.max(...G.teams.map(t=>t.score));G.tieTeams=G.teams.filter(t=>t.score===mx).map(t=>t.id);
  if(G.tieTeams.length>1){G.tieBreakIndex=0;G.tieBreakWinner=null;G.tieBreakResolvedByCorrect=false;G.teams.forEach(t=>t.tieBreakWinner=false);setPhase("TIEBREAK");renderTieBreak();return}
  G.tieBreakWinner=null;G.tieBreakResolvedByCorrect=false;G.tieTeams=[];G.teams.forEach(t=>t.tieBreakWinner=false);
  finalScreen();
}
function renderTieBreak(){const tb=TB[G.tieBreakIndex];scr(`<div class="card"><div class="stage-kicker">TIE-BREAK ${G.tieBreakIndex+1}/3</div><h2>Các đội hòa cao nhất</h2><p><b>${G.tieTeams.map(id=>esc(teamById(id).name)).join(", ")}</b></p><div class="note">Người điều khiển đọc câu; các đội ghi/giơ đáp án đồng thời. Câu tie-break không cộng điểm vào 24 câu chính.</div><h2>${esc(tb[0])}</h2><button data-action="reveal-tb">Hiện đáp án</button><div class="note hidden" id="tbAnswer"><b>${esc(tb[1])}</b></div><div style="margin-top:14px"><b>Đội trả lời đúng:</b>${G.tieTeams.map(id=>`<label class="check"><input type="checkbox" class="tbx" value="${id}"> ${esc(teamById(id).name)}</label>`).join("")}</div><div class="bottom-actions"><button class="pri" data-action="submit-tb">Xác nhận</button></div></div>`)}
function submitTieBreak(){
  const correct=[...document.querySelectorAll(".tbx:checked")].map(x=>+x.value).filter(id=>G.tieTeams.includes(id));
  if(correct.length===1){G.tieBreakWinner=correct[0];G.tieBreakResolvedByCorrect=false;G.teams.forEach(t=>t.tieBreakWinner=t.id===G.tieBreakWinner);saveState();finalScreen();return}
  if(G.tieBreakIndex<2){G.tieBreakIndex++;saveState();renderTieBreak();return}
  const tied=G.tieTeams.map(id=>teamById(id)).filter(Boolean);const maxCorrect=Math.max(...tied.map(t=>t.correct));const byCorrect=tied.filter(t=>t.correct===maxCorrect);
  G.tieBreakResolvedByCorrect=true;G.tieBreakWinner=byCorrect.length===1?byCorrect[0].id:null;G.teams.forEach(t=>t.tieBreakWinner=t.id===G.tieBreakWinner);
  saveState();finalScreen();
}
function finalWinnerTeams(){
  if(G.tieBreakWinner!==null){const w=teamById(G.tieBreakWinner);return w?[w]:[]}
  const topScore=Math.max(...G.teams.map(t=>t.score));const top=G.teams.filter(t=>t.score===topScore);
  if(G.tieBreakResolvedByCorrect&&G.tieTeams.length>1){const m=Math.max(...G.tieTeams.map(id=>teamById(id)?.correct||0));return top.filter(t=>t.correct===m)}
  return top;
}
function finalScreen(){closeModal();setPhase("FINAL");const ranked=rankedTeams();const winners=finalWinnerTeams();spawnConfetti();playTone("finish");scr(`<div class="card"><div class="center"><div class="stage-kicker">TÀU ĐÃ VỀ GA CUỐI</div><h1>${winners.length===1?`🏆 ${esc(winners[0].name)}`: `Đồng hạng nhất: ${winners.map(t=>esc(t.name)).join(" & ")}`}</h1><p>Đã đi qua đủ 4 chặng · Event đã phát: ${G.eventCount}</p></div><div class="final-grid">${G.teams.map(t=>`<div class="final-stat"><span>${esc(t.name)}</span><b>${t.score}</b><span>${t.correct} đúng · ${t.wrong} sai</span></div>`).join("")}</div><div style="overflow:auto"><table><tr><th>Hạng</th><th>Đội</th><th>Điểm</th><th>Đúng</th><th>Sai</th><th>Event nhận</th><th>Event dùng</th><th>Bị tấn công</th><th>Đã chặn</th><th>Bị bỏ lượt</th></tr>${ranked.map((t,i)=>`<tr><td>${rankingNumber(ranked,i)}</td><td style="color:${TEAM_COLORS[t.id]};font-weight:900">${esc(t.name)}</td><td><b>${t.score}</b></td><td>${t.correct}</td><td>${t.wrong}</td><td>${t.eventsReceived}</td><td>${t.eventsUsed}</td><td>${t.attacks}</td><td>${t.blocked}</td><td>${t.skipped}</td></tr>`).join("")}</table></div><div class="bottom-actions"><button class="pri" data-action="new">Chơi ván mới</button><button data-action="home">Về trang chủ</button></div></div>`);localStorage.removeItem(APP_KEY);G._finalPersisted=false}
function rankingNumber(arr,i){
  if(i===0)return 1;
  const a=arr[i],b=arr[i-1];
  if(a.score!==b.score)return i+1;
  if(G.tieBreakWinner!==null){if(a.id===G.tieBreakWinner)return 1;if(b.id===G.tieBreakWinner)return i+1;}
  if(G.tieBreakResolvedByCorrect&&a.correct!==b.correct)return i+1;
  return rankingNumber(arr,i-1);
}

function openModal(html,buttons,withDefault=true){const root=$("#modalRoot");modalState=modalState||{};root.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}<div class="modal-actions">${buttons.map((b,i)=>`<button data-modal-index="${i}" ${b[2]?"disabled":""}>${b[0]}</button>`).join("")}</div></div>`;root.classList.add("on");buttons.forEach((b,i)=>root.querySelector(`[data-modal-index="${i}"]`)?.addEventListener("click",()=>withAction(b[1])) )}
function closeModal(){$("#modalRoot").classList.remove("on");$("#modalRoot").innerHTML="";modalState=null}

function persist(){if(!G)return;try{const copy=JSON.parse(JSON.stringify(G));delete copy._finalPersisted;localStorage.setItem(APP_KEY,JSON.stringify(copy))}catch(_){}}
function saveState(){persist();renderShell()}
function loadSavedRaw(){try{const s=localStorage.getItem(APP_KEY);return s?JSON.parse(s):null}catch(_){return null}}
function resumeGame(){
  const raw=loadSavedRaw();if(!raw)return home();G=raw;
  if(!Array.isArray(G.usedEventIds))G.usedEventIds=[];
  if(!G.lastAttack)G.lastAttack={owner:-1,target:-1};
  if(!Array.isArray(G.questionAttempts))G.questionAttempts=[];
  if(!Array.isArray(G.attemptedTeams))G.attemptedTeams=G.questionAttempts.map(a=>a.teamId);
  G.questionStartTeam=Number.isInteger(G.questionStartTeam)?G.questionStartTeam:G.currentTeam;
  G.questionLastTeam=Number.isInteger(G.questionLastTeam)?G.questionLastTeam:null;
  G.questionResolved=!!G.questionResolved;
  G.renderedQuestionIndex=Number.isInteger(G.renderedQuestionIndex)?G.renderedQuestionIndex:(G.renderedOptions?.length===4?G.questionIndex:-1);G.forcedNext=G.forcedNext??null;G.forcedFollowNext=G.forcedFollowNext??null;G.extraRequested=!!G.extraRequested;G.tieBreakResolvedByCorrect=!!G.tieBreakResolvedByCorrect;G.teams.forEach(t=>{t.lastDeductionBlocked=!!t.lastDeductionBlocked;t.tieBreakWinner=!!t.tieBreakWinner});
  if(G.phase==="EVENT_ROLL"){
    if(G.eventRollOutcome==="event"&&G.pendingEventId){revealEvent(G.pendingEventId);return}
    if(G.eventRollOutcome==="noroll"){openModal(`<h3>Khóa Đường Ray</h3><p>Đội này đã bị khóa Event ở lần roll vừa lưu.</p>`,[["Tiếp tục",()=>finalizeTurnAndAdvance()]]);return}
    if(G.eventRollOutcome==="none"){openModal(`<h3>Roll Event</h3><p>Lần roll vừa lưu không có Event.</p>`,[["Tiếp tục",()=>finalizeTurnAndAdvance()]]);return}
    finalizeTurnAndAdvance();return
  }
  if(G.phase==="EVENT_REVEAL"&&G.pendingEventId){if(!G.renderedOptions?.length)prepareQuestion();renderQuestion();revealEvent(G.pendingEventId);return}
  if(G.phase==="DEFENSE"&&G.pendingAttack){renderQuestion();resumePendingDefense();return}
  if(G.phase==="QUESTION"){if(!G.renderedOptions?.length)prepareQuestion();renderQuestion();return}
  if(G.phase==="RESULT"){if(!G.renderedOptions?.length)prepareQuestion();renderResult();return}
  if(G.phase==="TIEBREAK"){renderTieBreak();return}
  if(G.phase==="FINAL"){finalScreen();return}
  if(G.phase==="STAGE_INTRO"){stageIntro(G.stageShown||0);return}
  home()
}
function clearSave(){localStorage.removeItem(APP_KEY);home()}
function spawnConfetti(){const c=$("#confetti");c.innerHTML=Array.from({length:30},(_,i)=>`<i style="left:${(i*3.43)%100}%;background:${["#F4B942","#167C80","#E56B5D","#3B82F6"][i%4]};animation-delay:${(i%7)*.12}s"></i>`).join("");setTimeout(()=>c.innerHTML="",3600)}

const ACTIONS={
 mute(){mute=!mute;renderShell();playTone("click")},
 setup(){setup()},
 start(){const names=[0,1,2].map(i=>(document.querySelector(`#teamNm${i}`).value.trim()||DEFAULT_NAMES[i]).slice(0,20));newGame(names)},
 go(){startQuestionForTeam(G.currentTeam)},
 answer(index){answer(+index)},
 after(){afterResult()},
 held(index){useHeld(+index)},
 resume(){resumeGame()},
 "clear-save"(){clearSave()},
 home(){home()},
 new(){clearSave();setup()},
 "reveal-tb"(){$("#tbAnswer")?.classList.remove("hidden")},
 "submit-tb"(){submitTieBreak()}
};

document.addEventListener("click",e=>{const btn=e.target.closest("[data-action]");if(!btn||btn.disabled)return;const action=btn.dataset.action;const fn=ACTIONS[action];if(!fn)return;playTone("click");if(["answer","after","held","start","go","submit-tb"].includes(action))withAction(()=>fn(btn.dataset.index));else fn(btn.dataset.index)});

// ===== Production QA helpers (only meaningful with ?qa=1) =====
window.__TAU_QA={
  getState:()=>JSON.parse(JSON.stringify(G)),
  clear:()=>{localStorage.removeItem(APP_KEY);G=null;home()},
  bootstrap:(names)=>newGame(names),
  forcePhase:(p)=>{G.phase=p;saveState()},
  canUse:(teamId,eventId)=>canUseEvent(teamById(teamId),eventId),
  validTargets:(teamId,eventId)=>validTargets(teamById(teamId),eventId).map(t=>t.id),
  setScores:(scores)=>scores.forEach((s,i)=>G.teams[i].score=s),
  setCurrent:(id)=>{G.currentTeam=id;if(G.phase!=="QUESTION")G.phase="QUESTION";renderQuestion()},
  setPendingNegative:(teamId,kind)=>{teamById(teamId).negativePending=kind?{kind,by:0}:null;},
  setSkip:(teamId)=>teamById(teamId).skipPending=true,
  setSkipStreak:(teamId,n)=>teamById(teamId).skipStreak=n,
  setLastSkip:(id)=>G.lastSkipTarget=id,
  setAttackLast:(owner,target)=>G.lastAttack={owner,target},
  setLock:(n)=>{G.lockOrderTurns=n;G.lockStartQuestion=G.questionIndex-n;G.lockLastConsumedQuestion=G.questionIndex-n},
  setForcedNext:(id)=>{G.forcedNext=id},
  setPlan:(ids)=>{G.turnPlan=ids.slice()},
  setExtra:(v)=>{G.extraRequested=v},
  setConsecutive:(n)=>{G.consecutiveTurns=n},
  advance:()=>chooseNextTeam(),
  consumeLock:()=>consumeOrderLock(),
  addHand:(teamId,eventId)=>teamById(teamId).hand.push(eventId),
  deduct:(teamId,n)=>deductPoints(teamById(teamId),n),
  useDirect:(teamId,eventId)=>useEvent(teamById(teamId),eventId,()=>{teamById(teamId).eventsUsed++;}),
  answer:(index=0)=>answer(index),
  render:()=>renderShell(),
  positionBag:()=>G.positionBag.slice()
};

function boot(){
  const saved=loadSavedRaw();
  if(saved){home()}else home();
}
boot();
</script>
